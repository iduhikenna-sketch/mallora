
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALLORA | Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}
header{background:#111827;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0;color:#e8ad35}
button{border:0;border-radius:7px;padding:11px 15px;cursor:pointer;font-weight:bold}
.logout{background:#fff;color:#111827}
main{max-width:1100px;margin:25px auto;padding:15px}
.panel{background:white;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 12px #0000000c}
input{width:100%;padding:13px;margin:9px 0;border:1px solid #ddd;border-radius:7px}
.primary{background:#e8ad35;color:#111827;width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#f7f8fb;padding:17px;border-radius:9px}
.stat strong{font-size:25px;display:block;margin-top:8px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{text-align:left;padding:13px;border-bottom:1px solid #eee}
th{background:#f7f8fb}
.table-wrap{overflow-x:auto}
.approve{background:#dcfce7;color:#166534}
.suspend{background:#fee2e2;color:#991b1b}
.status{font-weight:bold}
.hidden{display:none}
#message{padding:10px;margin-top:12px;border-radius:7px;white-space:pre-wrap}
</style>
</head>
<body>

<header>
<h2>MALLORA ADMIN</h2>
<button class="logout hidden" id="logoutBtn">Log Out</button>
</header>

<main>
<section class="panel" id="loginPanel">
<h2>Administrator Login</h2>
<p>Sign in using your authorized MALLORA admin account.</p>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button class="primary" id="loginBtn">Sign In</button>
<div id="loginMessage"></div>
</section>

<section id="dashboard" class="hidden">
<div class="panel">
<h2>Welcome to MALLORA</h2>
<p>Manage sellers and monitor your marketplace.</p>
</div>

<div class="stats panel">
<div class="stat">Total Stores<strong id="total">0</strong></div>
<div class="stat">Pending<strong id="pending">0</strong></div>
<div class="stat">Active<strong id="active">0</strong></div>
</div>

<div class="panel">
<h2>Seller Applications</h2>
<p>Review and manage registered stores.</p>
<button class="primary" id="refreshBtn">Refresh Stores</button>
<div id="message"></div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Store Name</th>
<th>Country</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="storesList"></tbody>
</table>
</div>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://njyrphzewgtybtxxkvwk.supabase.co";
const SUPABASE_KEY = "sb_publishable_EmUH_iUEsDdR5e8mwUZuRQ_xXnMoSsh";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

function message(text, error=false){
  $("message").textContent=text;
  $("message").style.color=error?"#b91c1c":"#166534";
}

async function checkAdmin(){
  const {data:{user},error} = await db.auth.getUser();

  if(error || !user){
    showLogin();
    return false;
  }

  if(user.app_metadata?.role !== "admin"){
    await db.auth.signOut();
    $("loginMessage").textContent =
      "Access denied. This account is not an administrator.";
    showLogin();
    return false;
  }

  $("loginPanel").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");

  await loadStores();
  return true;
}

function showLogin(){
  $("dashboard").classList.add("hidden");
  $("loginPanel").classList.remove("hidden");
  $("logoutBtn").classList.add("hidden");
}

async function login(){
  const email=$("email").value.trim();
  const password=$("password").value;

  if(!email || !password){
    $("loginMessage").textContent="Enter your email and password.";
    return;
  }

  $("loginBtn").disabled=true;
  $("loginMessage").textContent="Signing in...";

  const {error}=await db.auth.signInWithPassword({
    email,password
  });

  $("loginBtn").disabled=false;

  if(error){
    $("loginMessage").textContent=error.message;
    return;
  }

  $("loginMessage").textContent="";
  await checkAdmin();
}

async function loadStores(){
  message("Loading stores...");

  const {data,error}=await db
    .from("stores")
    .select("id,store_name,country,status,created_at")
    .order("created_at",{ascending:false});

  if(error){
    message("Could not load stores: "+error.message,true);
    return;
  }

  $("total").textContent=data.length;
  $("pending").textContent=data.filter(s=>s.status==="pending").length;
  $("active").textContent=data.filter(s=>s.status==="active").length;

  $("storesList").innerHTML="";

  if(!data.length){
    $("storesList").innerHTML=
      '<tr><td colspan="4">No stores registered yet.</td></tr>';
  }

  data.forEach(store=>{
    const tr=document.createElement("tr");

    const name=document.createElement("td");
    name.textContent=store.store_name;

    const country=document.createElement("td");
    country.textContent=store.country||"Not provided";

    const status=document.createElement("td");
    status.textContent=store.status;
    status.className="status";

    const action=document.createElement("td");

    if(store.status==="pending"){
      const btn=document.createElement("button");
      btn.textContent="Approve";
      btn.className="approve";
      btn.onclick=()=>changeStatus(store.id,"active");
      action.appendChild(btn);

    }else if(store.status==="active"){
      const btn=document.createElement("button");
      btn.textContent="Suspend";
      btn.className="suspend";
      btn.onclick=()=>changeStatus(store.id,"suspended");
      action.appendChild(btn);

    }else{
      const btn=document.createElement("button");
      btn.textContent="Reactivate";
      btn.className="approve";
      btn.onclick=()=>changeStatus(store.id,"active");
      action.appendChild(btn);
    }

    tr.append(name,country,status,action);
    $("storesList").appendChild(tr);
  });

  message("Stores loaded successfully.");
}

async function changeStatus(id,status){
  const action=status==="active"?"activate":"suspend";

  if(!confirm("Are you sure you want to "+action+" this store?")){
    return;
  }

  message("Updating store...");

  const {error}=await db
    .from("stores")
    .update({status:status})
    .eq("id",id)
    .eq("status",status==="active"?"pending":"active");

  if(error){
    message("Update failed: "+error.message,true);
    return;
  }

  message("Store status updated.");
  await loadStores();
}

$("loginBtn").addEventListener("click",login);
$("refreshBtn").addEventListener("click",loadStores);

$("logoutBtn").addEventListener("click",async()=>{
  await db.auth.signOut();
  showLogin();
});

db.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT") showLogin();
});

checkAdmin();
</script>
</body>
</html>
